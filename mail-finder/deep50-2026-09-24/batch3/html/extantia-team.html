<script>
document.addEventListener("DOMContentLoaded", function() {
    var pathArray = window.location.pathname.split("/").filter(Boolean);
    var breadcrumbItems = [];

        "position": 1,
        "name": "Startseite",
        "item": siteUrl
    });

    var currentPath = siteUrl;
    for (var i = 0; i < pathArray.length; i++) {
        currentPath += "/" + pathArray[i];
        breadcrumbItems.push({
            "@type": "ListItem",
            "position": i + 2,
            "name": pathArray[i].replace("-", " ").toUpperCase(),
            "item": currentPath
        });
    }

    breadcrumbJson.itemListElement = breadcrumbItems;
    var scriptTag = document.createElement("script");
    scriptTag.type = "application/ld+json";
    scriptTag.innerHTML = JSON.stringify(breadcrumbJson);
    document.head.appendChild(scriptTag);

</script>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<!-- Smooth Scroll -->

<script>
$("[data-animate='headline']").each(function () {
  let tl = gsap.timeline({
    scrollTrigger: {
      trigger: $(this),
      start: "top 90%",
      toggleActions: "play none none none",
    }
  });

  // Sofort bei 100vw starten
  tl.set($(this), { x: "100vw" })

    // Sofort zu 66vw springen
    .to($(this), { x: "66vw", duration: 0 })

    // Verweilen bei 66vw
    .to($(this), {}, "+=0.00001") // Pause für 0.3 Sekunden

    // Sofort zu 33vw springen
    .to($(this), { x: "33vw", duration: 0 })

    // Verweilen bei 33vw
    .to($(this), {}, "+=0.00001") // Pause für 0.3 Sekunden

    // Sofort zu 0vw springen
    .to($(this), { x: "0vw", duration: 0 });
});

const linkWraps = document.querySelectorAll(".nav_link_wrap");

gsap.matchMedia().add("(min-width: 992px)", () => {
  linkWraps.forEach((linkWrap) => {
    let hoverTimeout; // Variable zum Speichern des Timeout-Handlers

    // Hover In mit Verzögerung
    linkWrap.addEventListener("mouseenter", () => {
      hoverTimeout = setTimeout(() => {
        const menuLinks = linkWrap.querySelectorAll(".menu_link");
        gsap.to(menuLinks, {
          opacity: 1,
          y: 0,
          duration: 0.3, // Dauer der gesamten Animation
          ease: "power2.out",
          stagger: {
            amount: 0.2, // Gesamtdauer der Stagger-Animation
          },
        });
      }, 200); // Verzögerung von 0.2 Sekunden
    });

    // Hover Out: Sofortiges Zurücksetzen der Animation
    linkWrap.addEventListener("mouseleave", () => {
      clearTimeout(hoverTimeout); // Timeout abbrechen, falls Hover vorzeitig endet
      const menuLinks = linkWrap.querySelectorAll(".menu_link");
      gsap.to(menuLinks, {
        opacity: 0,
        y: -10,
        duration: 0.3, // Dauer der gesamten Animation
        ease: "power2.in",
        stagger: {
          amount: 0.2, // Gesamtdauer der Stagger-Animation
        },
      });
    });
  });
});

const navMenu = document.querySelector('.nav_menu');

// Beobachte Änderungen am `data-nav-menu-open`-Attribut
const observer = new MutationObserver((mutationsList) => {
  mutationsList.forEach((mutation) => {
    if (mutation.attributeName === 'data-nav-menu-open') {
      const isOpen = navMenu.hasAttribute('data-nav-menu-open');

      if (isOpen) {
        // Animation beim Öffnen mit Verzögerung
        gsap.fromTo(
          ".nav_menu .nav_link_wrap", { opacity: 0, y: "-2rem" },
          {
            opacity: 1,
            y: "0rem",
            duration: 0.8,
            ease: "power1.out",
            stagger: { amount: 0.4, each: 0.2 },
            delay: 0.1 // Verzögerung von 0.1 Sekunden
          }
        );
      } else {
        // Animation beim Schließen
        gsap.to(
          ".nav_menu .nav_link_wrap",
          {
            opacity: 0,
            y: "-2rem",
            duration: 0.8,
            ease: "power1.out"
          }
        );
      }
    }
  });
});

// Startet die Beobachtung für Attributänderungen
observer.observe(navMenu, { attributes: true });

let startColor = "#ecebe3";
let endColor = "#FD5300";
let finalColor = "#ecebe3";

gsap.utils.toArray('.svg_wrap').forEach(wrap => {
  let svgs = wrap.querySelectorAll('svg[data-animate]');

  let tl = gsap.timeline({
    scrollTrigger: {
      trigger: wrap,
      start: "top 85%", // Wenn die Oberkante von .svg_wrap 85% in den Viewport kommt
      toggleActions: "play none none reverse",
    }
  });

  svgs.forEach(svg => {
    let paths = svg.querySelectorAll('path');
    let animationType = svg.getAttribute('data-animate');

    // Standardfarben setzen, abhängig vom Animationstyp
    let startColor = "#000000";
    let endColor = "#FD5300";
    let finalColor = "#000000";

    if (animationType === "svg-icon-orange") {
      startColor = "#FD5300";
      endColor = "#ecebe3";
      finalColor = "#FD5300";
    } else if (animationType === "svg-icon-alternate") {
      startColor = "#FD5300";
      endColor = "#000000";
      finalColor = "#FD5300";
    } else if (animationType === "svg-icon-white") {
      startColor = "#ecebe3";
      endColor = "#FD5300";
      finalColor = "#ecebe3";
    } else if (animationType === "svg-icon-black") {
      startColor = "#000000";
      endColor = "#ecebe3";
      finalColor = "#000000";
    }

    // Sicherstellen, dass alle Pfade initial unsichtbar sind und die Startfarbe haben
    gsap.set(paths, { opacity: 0, fill: startColor });

    // Gruppiere Animation für alle Pfade eines SVGs
    tl.to(paths, {
      opacity: 1,
      fill: endColor, // Füllfarbe wechseln
      duration: 0.1
    }).to(paths, {
      fill: finalColor, // Füllfarbe zurücksetzen
      duration: 0.1
    }, "+=0.1");
  });

  // Setze Stagger zwischen den SVGs im Wrapper
  tl.to(
    svgs,
    {
      stagger: 0.1, // Verzögerung zwischen den SVGs
      duration: 0.1
    },
    0 // Startzeit
  );
});
</script></body></html>
