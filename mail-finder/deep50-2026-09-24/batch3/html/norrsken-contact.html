<script>
  function sendEmailToZapier(buttonId,inputId,formSourceText = '',hookUrl){
    var button = document.querySelector(`#${buttonId}`)
    if(button){
      button.addEventListener('click', e=>{
        var email = document.querySelector(`#${inputId}`)
        if(email){
          if(email.value && email.checkValidity()){
            fetch(hookUrl, {method: "POST",mode: "no-cors",
                            headers: {"Content-Type": "application/json"},
                            body: JSON.stringify({"email": email.value,"formSource": formSourceText})
                           })
              .then((response) => console.log("Email sent to Zapier:", response.status))
              .catch((error) => console.error("Error:", error));
          }
        }else{
          console.log(`Function sendEmailToZapier: Can't find Email Input element with ID: ${inputId}`);
        }
      });
    }else{
      console.log(`Function sendEmailToZapier: Can't find Button element with ID: ${buttonId}`);
    }
  }
</script>
