		<!-- Initial color scheme setter -->
		<script nonce="e43d7ec6ad06fc50e96d61c2e8304698">
			/**
			 * This script sets the initial theme based on the system settings or previously stored preference.
			 * This code can not be run on app initialization because with SSR we do not have access to the localStorage or window on the server.
			 * This script is needed to ensure that we do not flash the user with a light theme in the situation when a dark mode is required.
			 * With this script we can set the theme at the earliest we can possibly set the theme on the client side.
			 */

			/** @type {string} */
			let theme;
			/** @type {boolean} */
			const osPreferenceIsDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
			/** @type {string | null} */
			const storedPreference = localStorage.getItem('theme');

			if (storedPreference === null && osPreferenceIsDark) {
				theme = 'dark';
			} else {
				theme = storedPreference ?? 'light';
			}

			document.documentElement.setAttribute('data-theme', theme);

:"Well-being"}],"title":"A story of responsibility"},{"_type":"block.richTextSplit","id":"611d8161f58a","primaryContent":[{"_key":"8fdb3411b63e","_type":"block","children":[{"_key":"60f6d5be3f27","_type":"span","marks":[],"text":"A "},{"_key":"c7cf78b6dcf1","_type":"span","marks":["highlight"],"text":"greener future"},{"_key":"11d6eac582da","_type":"span","marks":[],"text":" for our planet"}],"id":"8fdb3411b63e","markDefs":[],"style":"h2"},{"_key":"47d706cb8dfa","_type":"block","children":[{"_key":"ed9e0464fe08","_type":"span","marks":[],"text":"Climate change has enormous consequences: rising temperatures, extreme drought, and unpredictable flooding. It's high time to take action. Together with our climate partner, "},{"_key":"93f54c197d71","_type":"span","marks":["75884a5ce8d7","highlight"],"text":"Go Forest"},{"_key":"c9c398b7168d","_type":"span","marks":[],"text":", we ensure that we offset our CO2 emissions as much as possible. We do this by planting trees in vulnerable areas: from Peru to Madagascar. This way, we not only restore our precious forests, but we also support the well-being of the local community."}],"id":"47d706cb8dfa","markDefs":[{"_key":"75884a5ce8d7","_type":"link","href":"https://www.go-impact.be/en/partners/arxus"}],"style":"normal"},{"_key":"e1d72bd59377","_type":"block","children":[{"_key":"ded1d5127a15","_type":"span","marks":[],"text":"Our partnership with Microsoft also affects our climate impact. In a positive way, in fact. As one of the largest IT companies in the world, Microsoft "},{"_key":"facb8eca5779","_type":"span","marks":["2f539e732060","highlight"],"text":"makes tremendous efforts"},{"_key":"599c10164ebe","_type":"span","marks":[],"text":" to create a greener society and to neutralize (and even restore) their impact on the climate."}],"id":"e1d72bd59377","markDefs":[{"_key":"2f539e732060","_type":"link","href":"https://www.microsoft.com/en-US/corporate-responsibility/sustainability"}],"style":"normal"},{"_key":"7966a51b20c4"," . Because when we implement a new technology, we make sure everyone knows about it. And can easily keep up with it."}],"id":"8c51bdf1ba05","markDefs":[],"style":"normal"},{"_key":"c7a3a587e792","_type":"block","children":[{"_key":"2615a67960ff","_type":"span","marks":[],"text":"Additionally, we're actively investing in our (future) colleagues as well: through training for soft and hard skills, the "},{"_key":"6d5846fd642c","_type":"span","marks":["78b885532bc3","highlight"],"text":"MiCronos Cloud Academy"},{"_key":"c3982e4f48ee","_type":"span","marks":[],"text":" and "},{"_key":"80a5229f5daf","_type":"span","marks":["3d08606d4f46","highlight"],"text":"Hack The Future"},{"_key":"1ef17426fabd","_type":"span","marks":[],"text":" we provide them with the necessary digital skills and give them the opportunity to further develop their talents."}],"id":"c7a3a587e792","markDefs":[{"_key":"78b885532bc3","_type":"link","href":"https://cloudacademy.micronos.be/"},{"_key":"3d08606d4f46","_type":"link","href":"https://www.hackthefuture.be/"}],"style":"normal"}]},{"_key":"1d732d810cab","_type":"block.insight.collection","id":"1d732d810cab","insights":[{"_type":"page.insight","contentTypes":"blog","description":"Building innovative and sustainable solutions? That can be quite challenging. So, to help your organization achieve its ecological and socio-economic goals, we collaborate with EpicHorizons, a data-driven company that assists organizations in meeting the latest sustainability requirements, such as CSRD. Together, we guide you through the vast array of reporting tools, so that you can elevate your ESG reports to a new level. Ready to get started?","id":"ccf00ed4-c16e-4fa2-a628-dd131316ddab","image":{"_key":null,"_type":"image","alt":"Gain insights into your ESG data with Microsoft's Cloud for Sustainability | Arxus","asset":{"_id":"image-4d47224cfafaf10aa3347f01333193f9ba29a700-1600x900-png","dimensions":{"aspectRatio":1.7777777777777777},"extension":"png","lqip":"data:imag gic tech-lover with commercial flair and a passion for the cloud? Then we have the perfect job for you, here at Arxus. As a Cloud Solution Sales, you combine technical insights with impeccable commercial acumen. You delve into our Azure-based solutions, clearly identify your clients' needs, and transform them into scalable, futureproof solutions. You know exactly how to get clients excited about the power of the cloud.\nIn short: you are the bridge between technology and business. Sounds like your thing? Keep reading.","id":"03aad6e0-6e26-439b-94c4-c13ae0d3d0a4","slug":"azure-solutions-sales","subtitle":"Lume","title":"Azure Solution Sales"},{"_type":"page.job","description":"As a Cloud Agent, you are responsible for the case follow-up process. You will perform a wide range of tasks and work closely with customers and internal teams.","id":"38fdf6d3-8fcd-4a6b-9f0b-82a21fe3dfc4","slug":"cloud-agent","subtitle":"Customer Operations Tribe","title":"Cloud Agent"},{"_type":"page.job","description":"As Senior Product Owner Billing, you will:\n\nLead the development of a partner-friendly billing platform integrated into our digital ecosystem.\nFocus on delivering high-impact features and coordinating end-to-end delivery across development teams.\nCollaborate closely with other Product Owners and the CX Lead to ensure seamless digital business interactions.\nShape a billing experience that is intuitive, scalable, and aligned with strategic goals.","id":"55651cca-e56d-4654-8a99-e86f8dbc66e4","slug":"product-owner-billing","subtitle":"Customer Experience & Scale Tribe","title":"Product Owner Billing"},{"_type":"page.job","description":"Do you want to be the first point of contact for our customers and handle all the questions they have about their cloud environment? Do you want to build, implement, and manage efficient and optimal cloud solutions?","id":"a6380e63-0759-47f5-a26b-a75a2dfe9de4","slug":"junior-cloud-engineer","subtitle":"Customer Operations Tribe","title":"Junior
